name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_TAURI_DEPS: >-
    libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev
    libayatana-appindicator3-dev librsvg2-dev libgtk-layer-shell-dev libasound2-dev

jobs:
  frontend:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validation (version, i18n, lint, type-check, format, test, build)
        run: pnpm validate

      - name: Verify isolated plugins in Chromium
        run: pnpm test:plugin-runtime
        env:
          TYCO_TEST_BROWSER: google-chrome

  rust:
    name: Rust Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_TAURI_DEPS }}

      # Installs the toolchain and components pinned by
      # rust-toolchain.toml, so CI and local runs agree.
      - name: Setup Rust toolchain
        run: rustup toolchain install
        working-directory: src-tauri

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      - name: Run Rust tests
        run: cargo test --locked --workspace
        working-directory: src-tauri

  # Keeps the Windows and macOS backends compiling. Linux is covered by the
  # `rust` job above. Compilation and tests are required on every desktop OS.
  rust-platforms:
    name: Rust on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        run: rustup toolchain install
        working-directory: src-tauri

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Run Rust tests
        run: cargo test --locked --workspace
        working-directory: src-tauri

  external-control:
    name: Local control on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust toolchain
        run: rustup toolchain install
        working-directory: src-tauri
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Check local control clients and transports
        run: cargo clippy --locked -p tyco-activation-protocol -p tyco-ctl --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Test local control end to end
        run: cargo test --locked -p tyco-activation-protocol -p tyco-ctl
        working-directory: src-tauri

  bundle:
    name: Tauri Bundle
    runs-on: ubuntu-latest
    needs: [frontend, rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_TAURI_DEPS }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # Installs the toolchain and components pinned by
      # rust-toolchain.toml, so CI and local runs agree.
      - name: Setup Rust toolchain
        run: rustup toolchain install
        working-directory: src-tauri

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Verifies that the app actually bundles; artefacts are not published here.
      - name: Build the desktop bundle
        run: pnpm tauri:build

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  desktop-smoke:
    name: Linux System WebView Smoke
    runs-on: ubuntu-latest
    needs: [frontend, rust]
    steps:
      - uses: actions/checkout@v4
      - name: Install system webview and headless display
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_TAURI_DEPS }} webkit2gtk-driver xvfb openbox dbus-x11
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Setup Rust toolchain
        run: rustup toolchain install
        working-directory: src-tauri
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Install Tauri WebDriver
        run: cargo install tauri-driver --version 2.0.5 --locked
      - name: Build an embedded debug app
        run: pnpm tauri:build --debug --no-bundle
      - name: Verify the actual desktop runtime
        run: xvfb-run -a dbus-run-session -- sh -c 'openbox >/tmp/tyco-openbox.log 2>&1 & pnpm test:desktop'
      - name: Upload failed smoke screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-failure
          path: desktop-smoke-failure.png
          if-no-files-found: ignore
