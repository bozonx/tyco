name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_TAURI_DEPS: >-
    libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev
    libayatana-appindicator3-dev librsvg2-dev libgtk-layer-shell-dev libasound2-dev

jobs:
  frontend:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validation with unit test coverage
        run: pnpm check && pnpm test:tooling && pnpm test:cov && pnpm build

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-coverage
          path: |
            apps/desktop-ui/coverage/
            packages/plugin-*/coverage/
          if-no-files-found: error

      - name: Verify isolated plugins in Chromium
        run: pnpm test:plugin-runtime
        env:
          TYCO_TEST_BROWSER: google-chrome

  browser:
    name: Playwright Browser Tests
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run browser tests
        run: pnpm test:browser
      - name: Upload browser report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            apps/desktop-ui/playwright-report/
            apps/desktop-ui/test-results/
          retention-days: 14
          if-no-files-found: error

  rust:
    name: Rust Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_TAURI_DEPS }}

      # Installs the toolchain and components pinned by
      # rust-toolchain.toml, so CI and local runs agree.
      - name: Setup Rust toolchain
        run: rustup toolchain install
        working-directory: src-tauri

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      - name: Run Rust tests
        run: cargo test --locked --workspace
        working-directory: src-tauri

      - name: Install coverage tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Install LLVM tools for the pinned Rust toolchain
        run: rustup component add llvm-tools-preview

      - name: Collect Rust unit test coverage
        run: |
          mkdir -p coverage/rust
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --locked --workspace --lib --bins --lcov --output-path coverage/rust/lcov.info -- --skip integration_

      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-unit-coverage
          path: coverage/rust/
          if-no-files-found: error

  # Keeps the Windows and macOS backends compiling. Linux is covered by the
  # `rust` job above. Compilation and tests are required on every desktop OS.
  rust-platforms:
    name: Rust on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        run: rustup toolchain install
        working-directory: src-tauri

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Run Rust tests
        run: cargo test --locked --workspace
        working-directory: src-tauri

  external-control:
    name: Local control on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Rust toolchain
        run: rustup toolchain install
        working-directory: src-tauri
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Check local control clients and transports
        run: cargo clippy --locked -p tyco-activation-protocol -p tyco-ctl --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Test local control end to end
        run: cargo test --locked -p tyco-activation-protocol -p tyco-ctl
        working-directory: src-tauri

  bundle:
    name: Tauri Bundle
    runs-on: ubuntu-latest
    needs: [frontend, browser, rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_TAURI_DEPS }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # Installs the toolchain and components pinned by
      # rust-toolchain.toml, so CI and local runs agree.
      - name: Setup Rust toolchain
        run: rustup toolchain install
        working-directory: src-tauri

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Verifies that the app actually bundles; artefacts are not published here.
      - name: Build the desktop bundle
        run: pnpm tauri:build

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  desktop-smoke:
    name: Desktop Smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [frontend, browser, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install system webview and headless display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_TAURI_DEPS }} webkit2gtk-driver xvfb openbox dbus-x11 xdotool xclip python3-gi gir1.2-gtk-3.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Setup Rust toolchain
        run: rustup toolchain install
        working-directory: src-tauri
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Install Tauri WebDriver
        run: cargo install tauri-driver --version 2.0.5 --locked
      - name: Install matching Edge WebDriver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $edge = (Get-Item "${env:ProgramFiles(x86)}/Microsoft/Edge/Application/msedge.exe").VersionInfo.ProductVersion
          $driverDir = Join-Path $env:RUNNER_TEMP 'edge-driver'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$edge/edgedriver_win64.zip" -OutFile "$env:RUNNER_TEMP/edgedriver.zip"
          Expand-Archive "$env:RUNNER_TEMP/edgedriver.zip" -DestinationPath $driverDir
          $driverDir >> $env:GITHUB_PATH
      - name: Build the local control client
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked -p tyco-ctl
      - name: Build an embedded debug app
        run: pnpm tauri:build --debug --no-bundle
      - name: Verify the actual desktop runtime on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- sh -c 'openbox >/tmp/tyco-openbox.log 2>&1 & pnpm test:desktop'
      - name: Verify the actual desktop runtime on Windows
        if: runner.os == 'Windows'
        run: pnpm test:desktop
      - name: Upload smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-failure-${{ runner.os }}
          path: |
            desktop-smoke-failure.png
            desktop-smoke-failure.log
          if-no-files-found: ignore
