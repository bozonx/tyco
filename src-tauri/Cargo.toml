[package]
name = "tyco"
version = "0.1.0"
description = "TyCo - typing AI companion for writers and professionals who work with texts a lot"
authors = ["Kozyrin Ivan"]
edition = "2021"
rust-version = "1.98"

[workspace]
members = [".", "crates/activation-protocol", "tyco-ctl"]
resolver = "2"

[lib]
# `staticlib`/`cdylib` keep the mobile targets buildable; `rlib` lets integration
# tests in `tests/` link against the crate.
name = "tyco_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
cpal = "0.15"
futures-util = "0.3"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2.4.5"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tyco-activation-protocol = { path = "crates/activation-protocol" }
url = "2"
zbus = "5"

[dev-dependencies]
evdev = "0.13"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", features = ["global_shortcuts"] }
gtk = "0.18"
gtk-sys = "0.18"

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
