[package]
name = "tyco"
version = "0.1.0"
description = "TyCo - typing AI companion for writers and professionals who work with texts a lot"
authors = ["Kozyrin Ivan"]
edition = "2021"
rust-version = "1.98"

[workspace]
members = [".", "crates/activation-protocol", "tyco-ctl"]
resolver = "2"

[lib]
# `staticlib`/`cdylib` keep the mobile targets buildable; `rlib` lets integration
# tests in `tests/` link against the crate.
name = "tyco_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The activation benchmark socket, see `services/activation/metrics.rs`;
# `pnpm tauri:dev` turns it on when `TYCO_ACTIVATION_BENCH=1`.
activation-bench = []

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
cpal = "0.15"
futures-util = "0.3"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2"] }
# the crypto provider reqwest leaves to the app; ring, as tokio-tungstenite uses
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
regex = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
png = "0.18"
percent-encoding = "2"
webp = { version = "0.3", default-features = false }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2.4.5"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "signal", "process", "io-util", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tyco-activation-protocol = { path = "crates/activation-protocol", features = ["ts"] }
url = "2"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
zbus = "5"
tauri-plugin-dialog = "2.7.2"
ignore = "0.4.33"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
trash = "5.2.9"
globset = "0.4.20"
cap-std = "4.0.3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
evdev = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
# the Secret Service over zbus, like the rest of the D-Bus code
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
# remote_desktop does not build without screencast
ashpd = { version = "0.13.13", features = ["global_shortcuts", "remote_desktop", "screencast"] }
gtk = "0.18"
gtk-sys = "0.18"
x11rb = "0.14"
# the webview settings tao and wry do not expose
webkit2gtk = "2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
keyring-core = "1"
tauri-plugin-global-shortcut = "2.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
