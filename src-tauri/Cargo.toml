[package]
name = "tyco"
version = "0.1.0"
description = "TyCo - typing AI companion for writers and professionals who work with texts a lot"
authors = ["Kozyrin Ivan"]
edition = "2021"
rust-version = "1.98"

[lib]
# `staticlib`/`cdylib` keep the mobile targets buildable; `rlib` lets integration
# tests in `tests/` link against the crate.
name = "tyco_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.15"
futures-util = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2.4.5"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = "0.24"
zbus = "4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
