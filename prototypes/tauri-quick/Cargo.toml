[package]
name = "tauri-quick-lab"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gtk-sys = "0.18"
glib = "0.18"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
serde_json = "1"
evdev = "0.13"

[features]
# Требует системной libgtk-layer-shell (пакет gtk-layer-shell).
layer = []

[[example]]
name = "bench"
