packages:
  - apps/*
  - packages/*

allowBuilds:
  onnxruntime-node: true
  protobufjs: true
  sharp: true

catalog:
  '@eslint/js': '^10.0.1'
  '@trivago/prettier-plugin-sort-imports': '^6.0.2'
  '@types/node': '^26.6.5'
  '@vitejs/plugin-vue': '^6.0.10'
  '@vitest/coverage-v8': '^5.0.5'
  '@vue/test-utils': '^2.5.1'
  dotenv-cli: '^11.0.0'
  eslint: '^10.13.0'
  eslint-config-prettier: '^10.1.8'
  eslint-plugin-unused-imports: '^4.4.1'
  eslint-plugin-vue: '^10.11.1'
  globals: '^17.13.0'
  jsdom: '^30.1.3'
  prettier: '^3.9.10'
  prettier-plugin-jsdoc: '^1.8.1'
  remark-gfm: '^4.0.1'
  remark-parse: '^11.0.0'
  turbo: '^2.11.9'
  typescript: '^6.0.3'
  typescript-eslint: '^8.71.2'
  unified: '^11.0.5'
  unist-util-visit: '^5.1.0'
  'unplugin-vue-components': '^32.1.0'
  vite: '^8.3.4'
  vitest: '^5.0.5'
  vue-eslint-parser: '^10.4.1'
  'vue-tsc': '^3.3.13'

minimumReleaseAgeExclude:
  - '@bozonx/ai-kit@0.6.3'
  - '@ai-sdk/deepseek@3.0.50'

overrides:
  # rehype-katex renders with katex 0.16 while the app ships 0.19 styles,
  # and mermaid pins the withdrawn 0.18.11; keep a single version.
  katex: '^0.19.0'
